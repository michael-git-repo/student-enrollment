name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-enrollment-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform state
        working-directory: infra
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=student-enrollment/dev/terraform.tfstate" -backend-config="region=${{ secrets.AWS_REGION }}" -backend-config="use_lockfile=true"

      - name: Create ECR repository
        working-directory: infra
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.app -var="aws_region=${{ secrets.AWS_REGION }}"

      - name: Read ECR repository URL
        id: ecr
        working-directory: infra
        run: echo "repository=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REPOSITORY: ${{ steps.ecr.outputs.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy ECS service
        working-directory: infra
        run: terraform apply -input=false -auto-approve -var="aws_region=${{ secrets.AWS_REGION }}" -var="container_image=${{ steps.ecr.outputs.repository }}:${{ github.sha }}"

      - name: Show website URL
        working-directory: infra
        run: terraform output website_url
